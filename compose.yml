# Het gemeenschapsplatform van Digitaal GemeenGoed en NL-Dit: leden, fora,
# nieuwsbrief, meldingen en projecten. Draait op een eigen server (VPS 4), los
# van de Office Assistent: een eigen Keycloak, geen koppeling met het archief.
#
#   <domein>              WordPress met BuddyPress (leden, groepen, profielen),
#                         bbPress (fora onder /forum/) en CiviCRM (netwerk,
#                         mailings, toestemmingen)
#   aanmelden.<domein>    Keycloak, realm "gemeenschap": lid worden, inloggen
#   projecten.<domein>    Redmine: meldingen, wensen, roadmap, portfolio
#   forum.<domein>        verwijst naar <domein>/forum/
#   kennis.<domein>       Wiki.js: de kennisbank, alleen voor leden
#   architectuur.<domein> de architectuurmodellen (Archi), alleen voor leden
#   documenten.<domein>   dg-documenten: bestanden van de coöperatie en per project
#
# Niet met de hand starten: server/installeer.sh zet alles neer, en daarna
# rolt server/uitrol.sh (elke vijf minuten, systemd-timer dg-uitrol) uit wat
# er op GitHub verandert. Zie README.md.

name: dg-gemeenschap

x-smtp: &smtp
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_POORT: ${SMTP_POORT:-587}
  SMTP_GEBRUIKER: ${SMTP_GEBRUIKER:-}
  SMTP_WACHTWOORD: ${SMTP_WACHTWOORD:-}
  SMTP_AFZENDER: ${SMTP_AFZENDER:-noreply@${DOMEIN}}

x-wordpress-omgeving: &wordpress-omgeving
  <<: *smtp
  WORDPRESS_DB_HOST: wp-db
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: ${WP_DB_WACHTWOORD:?}
  # Achter Caddy: de browser praat https, de container http.
  WORDPRESS_CONFIG_EXTRA: |
    if ( ( $$_SERVER['HTTP_X_FORWARDED_PROTO'] ?? '' ) === 'https' ) { $$_SERVER['HTTPS'] = 'on'; }
    define( 'WP_HOME', 'https://${DOMEIN}' );
    define( 'WP_SITEURL', 'https://${DOMEIN}' );
    define( 'FORCE_SSL_ADMIN', true );
    define( 'DISALLOW_FILE_EDIT', true );
    define( 'WP_AUTO_UPDATE_CORE', 'minor' );
  # Waar een pagina uit inhoud/ op GitHub staat (link "Bewerken op GitHub").
  DG_INHOUD_REPO: ${DG_INHOUD_REPO:-https://github.com/digitaalgemeengoed/gemeenschap/blob/main/inhoud}
  # Redmine voor het dashboard (dg-dashboard.php): intern voor de API, publiek voor links.
  DG_REDMINE_INTERN: http://redmine:3000
  DG_REDMINE_URL: https://projecten.${DOMEIN}
  # Uitnodigingen (dg-uitnodigen.php): een geldige uitnodiging opent de afscherming.
  DG_TOEGANG_COOKIE: ${DG_TOEGANG_COOKIE:-}
  # Projectvoorstellen (dg-projectvoorstel.php): het account "site" in Redmine, geen beheerder.
  DG_REDMINE_SITE_KEY: ${REDMINE_SITE_API_KEY:?}
  # Inloggen via Keycloak (gelezen door wp-content/mu-plugins/dg-gemeenschap.php).
  DG_KEYCLOAK_URL: https://aanmelden.${DOMEIN}
  DG_KEYCLOAK_INTERN: http://keycloak:8080
  DG_KEYCLOAK_REALM: gemeenschap
  WP_CLIENT_SECRET: ${WP_CLIENT_SECRET:?}
  # Berichten namens Documenten bij het delen (dg-gemeenschap.php, /wp-json/dg/v1/bericht).
  DG_BERICHT_GEHEIM: ${DOC_BERICHT_GEHEIM:?}

x-wordpress-mappen: &wordpress-mappen
  - wphtml:/var/www/html
  - ./wordpress/dg-gemeenschap.php:/var/www/html/wp-content/mu-plugins/dg-gemeenschap.php:ro
  - ./wordpress/dg-inhoud.php:/var/www/html/wp-content/mu-plugins/dg-inhoud.php:ro
  - ./wordpress/dg-dashboard.php:/var/www/html/wp-content/mu-plugins/dg-dashboard.php:ro
  - ./wordpress/dg-crowdfunding.php:/var/www/html/wp-content/mu-plugins/dg-crowdfunding.php:ro
  - ./wordpress/dg-projectvoorstel.php:/var/www/html/wp-content/mu-plugins/dg-projectvoorstel.php:ro
  - ./wordpress/dg-uitnodigen.php:/var/www/html/wp-content/mu-plugins/dg-uitnodigen.php:ro
  - ./wordpress/thema/digitaalgemeengoed:/var/www/html/wp-content/themes/digitaalgemeengoed:ro
  - ./wordpress/php.ini:/usr/local/etc/php/conf.d/dg-gemeenschap.ini:ro

services:
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMEIN: ${DOMEIN:?}
      # Afschermen met gebruikersnaam en wachtwoord: server/afschermen.sh.
      DG_TOEGANG: ${DG_TOEGANG:-open}
      DG_TOEGANG_GEBRUIKER: ${DG_TOEGANG_GEBRUIKER:-}
      DG_TOEGANG_HASH: ${DG_TOEGANG_HASH:-}
      # Geheim: na het inloggen hoeft het niet opnieuw (zie caddy/Caddyfile).
      DG_TOEGANG_COOKIE: ${DG_TOEGANG_COOKIE:?}
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddydata:/data
      # De HTML-rapporten van de architectuurmodellen (server/architectuur.sh).
      - /srv/dg-architectuur:/srv/architectuur:ro
    depends_on: [wordpress, keycloak, redmine, wiki, oauth2-proxy, documenten]

  # --- Keycloak: de bron voor leden, organisaties, groepen en toestemmingen ----
  keycloak-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_WACHTWOORD:?}
      POSTGRES_DB: keycloak
    volumes:
      - kcdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSIE:-26.8.2}
    restart: unless-stopped
    # De realm komt uit keycloak/realm/ en wordt bij elke uitrol bijgewerkt
    # door keycloak-config (hieronder); leden en organisaties staan in de database.
    command: ["start"]
    environment:
      <<: *smtp
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_WACHTWOORD}
      KC_HOSTNAME: https://aanmelden.${DOMEIN}
      # Het beheerscherm is van buiten afgesloten (Caddyfile); je bereikt het
      # via een SSH-tunnel op http://localhost:8080/admin (zie README.md).
      KC_HOSTNAME_ADMIN: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BEHEERDER:-beheer}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BEHEERDER_WACHTWOORD:?}
    volumes:
      - ./keycloak/themes/digitaalgemeengoed:/opt/keycloak/themes/digitaalgemeengoed:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      keycloak-db: { condition: service_healthy }

  # De realm "gemeenschap" gelijk trekken met keycloak/realm/gemeenschap.json.
  # Draait alleen op verzoek (server/bijwerken.sh). Wat beheerders in Keycloak
  # zelf aanmaken (leden, organisaties, extra groepen) laat het staan.
  keycloak-config:
    image: adorsys/keycloak-config-cli:${KEYCLOAK_CONFIG_VERSIE:-6.5.1-26}
    profiles: ["gereedschap"]
    environment:
      <<: *smtp
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: ${KC_BEHEERDER:-beheer}
      KEYCLOAK_PASSWORD: ${KC_BEHEERDER_WACHTWOORD:?}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 180s
      IMPORT_FILES_LOCATIONS: /config/*.json
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      IMPORT_CACHE_ENABLED: "false"
      DG_BASIS_URL: https://${DOMEIN}
      REDMINE_BASIS_URL: https://projecten.${DOMEIN}
      WP_CLIENT_SECRET: ${WP_CLIENT_SECRET:?}
      REDMINE_CLIENT_SECRET: ${REDMINE_CLIENT_SECRET:?}
      REDMINE_SYNC_SECRET: ${REDMINE_SYNC_SECRET:?}
      WIKI_BASIS_URL: https://kennis.${DOMEIN}
      WIKI_CLIENT_SECRET: ${WIKI_CLIENT_SECRET:?}
      ARCH_BASIS_URL: https://architectuur.${DOMEIN}
      ARCH_CLIENT_SECRET: ${ARCH_CLIENT_SECRET:?}
      DOC_BASIS_URL: https://documenten.${DOMEIN}
      DOC_CLIENT_SECRET: ${DOC_CLIENT_SECRET:?}
      BEHEER_BASIS_URL: https://beheer.${DOMEIN}
      BEHEER_CLIENT_SECRET: ${BEHEER_CLIENT_SECRET:?}
      BEHEER_KEYCLOAK_SECRET: ${BEHEER_KEYCLOAK_SECRET:?}
    volumes:
      - ./keycloak/realm:/config:ro
    depends_on: [keycloak]

  # --- WordPress: site, BuddyPress, bbPress, CiviCRM --------------------------
  wp-db:
    image: mariadb:${MARIADB_VERSIE:-11.8}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${WP_DB_WACHTWOORD:?}
      MARIADB_ROOT_PASSWORD: ${WP_DB_ROOT_WACHTWOORD:?}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - wpdbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  wordpress:
    # De image zet WordPress alleen de eerste keer neer; daarna werkt bijwerken.sh
    # WordPress, de plugins en de vertalingen bij met wp-cli.
    image: wordpress:${WORDPRESS_IMAGE:-php8.3-apache}
    restart: unless-stopped
    environment: *wordpress-omgeving
    volumes: *wordpress-mappen
    depends_on:
      wp-db: { condition: service_healthy }

  # wp-cli, voor installeren en bijwerken (wordpress/inrichten.sh) en voor de
  # pagina's uit inhoud/ (wp dg inhoud /inhoud). Draait alleen op verzoek.
  wpcli:
    image: wordpress:${WPCLI_VERSIE:-cli-php8.3}
    profiles: ["gereedschap"]
    user: "33:33"
    environment:
      <<: *wordpress-omgeving
      DOMEIN: ${DOMEIN}
      WP_BEHEER_WACHTWOORD: ${WP_BEHEER_WACHTWOORD:?}
      CIVICRM_VERSIE: ${CIVICRM_VERSIE:-6.20.0}
      BUDDYX_VERSIE: ${BUDDYX_VERSIE:-5.2.0}
      HOME: /tmp
    volumes:
      - wphtml:/var/www/html
      - ./wordpress/dg-gemeenschap.php:/var/www/html/wp-content/mu-plugins/dg-gemeenschap.php:ro
      - ./wordpress/dg-inhoud.php:/var/www/html/wp-content/mu-plugins/dg-inhoud.php:ro
      - ./wordpress/dg-dashboard.php:/var/www/html/wp-content/mu-plugins/dg-dashboard.php:ro
      - ./wordpress/dg-crowdfunding.php:/var/www/html/wp-content/mu-plugins/dg-crowdfunding.php:ro
      - ./wordpress/thema/digitaalgemeengoed:/var/www/html/wp-content/themes/digitaalgemeengoed:ro
      - ./wordpress/inrichten.sh:/usr/local/bin/dg-inrichten:ro
      # Dezelfde PHP-instellingen als de site; CiviCRM heeft meer dan 128 MB nodig.
      - ./wordpress/php.ini:/usr/local/etc/php/conf.d/dg-gemeenschap.ini:ro
      # De pagina's: bij de uitrol de versie van main (zie server/uitrol.sh).
      - ${DG_INHOUD:-./inhoud}:/inhoud:ro
    depends_on:
      wp-db: { condition: service_healthy }

  # --- Redmine: meldingen, wensen, roadmap, portfolio -------------------------
  redmine-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: ${REDMINE_DB_WACHTWOORD:?}
      POSTGRES_DB: redmine
    volumes:
      - rmdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redmine"]
      interval: 5s
      retries: 20

  redmine:
    build:
      context: ./redmine
      args:
        REDMINE_VERSIE: ${REDMINE_VERSIE:-6.1.6}
        REDMINE_OAUTH_VERSIE: ${REDMINE_OAUTH_VERSIE:-v4.2.3}
    image: dg/redmine:${REDMINE_VERSIE:-6.1.6}
    restart: unless-stopped
    environment:
      <<: *smtp
      DOMEIN: ${DOMEIN}
      REDMINE_DB_POSTGRES: redmine-db
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: ${REDMINE_DB_WACHTWOORD:?}
      REDMINE_DB_DATABASE: redmine
      REDMINE_SECRET_KEY_BASE: ${REDMINE_SECRET_KEY_BASE:?}
      # Ook voor rails runner via docker compose exec: het entrypoint zet de sleutel
      # alleen voor zijn eigen proces.
      SECRET_KEY_BASE: ${REDMINE_SECRET_KEY_BASE:?}
      REDMINE_PLUGINS_MIGRATE: "1"
      # Voor redmine/inrichten.rb:
      REDMINE_CLIENT_SECRET: ${REDMINE_CLIENT_SECRET:?}
      REDMINE_API_KEY: ${REDMINE_API_KEY:?}
      REDMINE_SITE_API_KEY: ${REDMINE_SITE_API_KEY:?}
      REDMINE_ADMIN_WACHTWOORD: ${REDMINE_ADMIN_WACHTWOORD:?}
    volumes:
      - rmfiles:/usr/src/redmine/files
    depends_on:
      redmine-db: { condition: service_healthy }

  # De groepen onder /netwerk in Keycloak als groepen in Redmine; elke 10 minuten.
  redmine-groepen:
    image: python:3.13-alpine
    restart: unless-stopped
    command: ["python", "-I", "/opt/redmine_groepen.py"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: gemeenschap
      SYNC_CLIENT_SECRET: ${REDMINE_SYNC_SECRET:?}
      REDMINE_URL: http://redmine:3000
      REDMINE_API_KEY: ${REDMINE_API_KEY:?}
      DOCUMENTEN_URL: https://documenten.${DOMEIN}
      # Ook projectvoorstellen: een goedgekeurd voorstel wordt binnen deze tijd een project.
      INTERVAL: "300"
    volumes:
      - ./redmine/redmine_groepen.py:/opt/redmine_groepen.py:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [keycloak, redmine]

  # --- Kennisbank: Wiki.js (kennis.<domein>), alleen voor leden ------------------
  wiki-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: ${WIKI_DB_WACHTWOORD:?}
      POSTGRES_DB: wiki
    volumes:
      - wikidb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki"]
      interval: 5s
      retries: 20

  wiki:
    build:
      context: .
      dockerfile: wiki/Dockerfile
      args:
        WIKI_VERSIE: ${WIKI_VERSIE:-2}
    image: dg/wiki:${WIKI_VERSIE:-2}
    restart: unless-stopped
    environment:
      DB_PASS: ${WIKI_DB_WACHTWOORD:?}
    volumes:
      # Geüploade bestanden en de werkkopie van de Git-opslag (kennisbank-repo).
      - wikidata:/wiki/data/content
      - wikirepo:/wiki/data/repo
    depends_on:
      wiki-db: { condition: service_healthy }

  # Wiki.js inrichten (wiki/inrichten.py): bij elke bijwerken.sh.
  wiki-inrichten:
    image: python:3.13-alpine
    profiles: ["gereedschap"]
    command: ["python", "-I", "/opt/inrichten.py"]
    environment:
      DOMEIN: ${DOMEIN}
      WIKI_INTERN: http://wiki:3000
      KEYCLOAK_INTERN: http://keycloak:8080
      WIKI_BEHEER_WACHTWOORD: ${WIKI_BEHEER_WACHTWOORD:?}
      WIKI_CLIENT_SECRET: ${WIKI_CLIENT_SECRET:?}
      KENNISBANK_REPO: ${KENNISBANK_REPO:-}
      KENNISBANK_SLEUTEL: /geheimen/kennisbank
    volumes:
      - ./wiki/inrichten.py:/opt/inrichten.py:ro
      # De eerste pagina's (alleen pagina's die nog niet bestaan).
      - ./wiki/startinhoud:/opt/startinhoud:ro
      - ./geheimen:/geheimen:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [wiki, keycloak]

  # --- Architectuurmodellen: alleen voor leden (architectuur.<domein>) --------------
  # Caddy vraagt bij elke aanvraag aan oauth2-proxy of iemand is ingelogd bij
  # Keycloak en lid is (groep /netwerk/gebruikers).
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:${OAUTH2_PROXY_VERSIE:-v7.15.6}
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_CLIENT_ID: architectuur
      OAUTH2_PROXY_CLIENT_SECRET: ${ARCH_CLIENT_SECRET:?}
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://aanmelden.${DOMEIN}/realms/gemeenschap
      # Geen discovery via internet: inloggen gaat via het publieke adres,
      # tokens en sleutels rechtstreeks bij Keycloak.
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_LOGIN_URL: https://aanmelden.${DOMEIN}/realms/gemeenschap/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://keycloak:8080/realms/gemeenschap/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://keycloak:8080/realms/gemeenschap/protocol/openid-connect/certs
      OAUTH2_PROXY_VALIDATE_URL: http://keycloak:8080/realms/gemeenschap/protocol/openid-connect/userinfo
      OAUTH2_PROXY_REDIRECT_URL: https://architectuur.${DOMEIN}/oauth2/callback
      OAUTH2_PROXY_WHITELIST_DOMAINS: architectuur.${DOMEIN}
      OAUTH2_PROXY_SCOPE: openid email profile
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_ALLOWED_GROUPS: /netwerk/gebruikers
      OAUTH2_PROXY_COOKIE_SECRET: ${ARCH_COOKIE_SECRET:?}
      OAUTH2_PROXY_COOKIE_NAME: _dg_architectuur
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_EXPIRE: 8h
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: static://202
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [keycloak]

  # --- Documenten (documenten.<domein>): een lichte XENA ------------------------
  # Een register (documenten-db) naast een objectopslag (Garage, S3). Zie
  # documenten/ONTWERP.md. Garage is alleen binnen dit netwerk bereikbaar.
  garage:
    image: dxflrs/garage:${GARAGE_VERSIE:-v2.5.0}
    restart: unless-stopped
    # Eén node zonder replicatie; sleutel en bucket uit de omgeving (blijven bestaan).
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_GEHEIM:?}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_SLEUTEL:?}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_GEHEIM:?}
      GARAGE_DEFAULT_BUCKET: documenten
    volumes:
      - ./documenten/garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data

  documenten-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: documenten
      POSTGRES_PASSWORD: ${DOC_DB_WACHTWOORD:?}
      POSTGRES_DB: documenten
    volumes:
      - docdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documenten"]
      interval: 5s
      retries: 20

  documenten:
    build:
      context: .
      dockerfile: documenten/Dockerfile
    image: dg/documenten:latest
    restart: unless-stopped
    environment:
      DOC_BASIS_URL: https://documenten.${DOMEIN}
      OIDC_UITGEVER: https://aanmelden.${DOMEIN}/realms/gemeenschap
      OIDC_INTERN: http://keycloak:8080/realms/gemeenschap
      OIDC_CLIENT_ID: documenten
      OIDC_CLIENT_GEHEIM: ${DOC_CLIENT_SECRET:?}
      SESSIE_GEHEIM: ${DOC_SESSIE_GEHEIM:?}
      DATABASE_URL: postgres://documenten:${DOC_DB_WACHTWOORD:?}@documenten-db:5432/documenten?sslmode=disable
      S3_EINDPUNT: http://garage:3900
      S3_BUCKET: documenten
      S3_SLEUTEL: ${GARAGE_SLEUTEL:?}
      S3_GEHEIM: ${GARAGE_GEHEIM:?}
      # Projecten en hun leden (elke vijf minuten), met de API-sleutel van het noodaccount.
      REDMINE_URL: http://redmine:3000
      REDMINE_API_KEY: ${REDMINE_API_KEY:?}
      REDMINE_PUBLIEK: https://projecten.${DOMEIN}
      MAX_MB: ${DOC_MAX_MB:-500}
      # Bij het delen een bericht via de site (BuddyPress).
      DOC_BERICHT_GEHEIM: ${DOC_BERICHT_GEHEIM:?}
      WORDPRESS_URL: http://wordpress
      WORDPRESS_HOST: ${DOMEIN}
      # Wie in de kerngroep zit (voor de persoonlijke ruimtes), met de client redmine-sync.
      KEYCLOAK_SYNC_GEHEIM: ${REDMINE_SYNC_SECRET:?}
      # Persoonlijke ruimtes (Mijn documenten): quotum in MB.
      DOC_QUOTUM_PERSOONLIJK_MB: ${DOC_QUOTUM_PERSOONLIJK_MB:-1024}
      # Zoeken (zoeken.go): OpenSearch, alleen intern. Leeg = zoeken staat uit.
      # Is OpenSearch er (nog) niet, dan werkt de rest gewoon en wacht de index.
      ZOEK_URL: http://opensearch:9200
      # Welk niveau een rol in Redmine geeft (0 geen, 1 lezen, 2 bewerken, 3 beheren).
      DOC_ROLLEN: ${DOC_ROLLEN:-Gebruiker=0,Contributor=2,Member=2,Kerngroep=3,Manager=3,Projectmanager=3,Projectleider=3}
    volumes:
      # Uploads gaan eerst hierheen (met controlegetal), dan naar de opslag.
      - doctmp:/tmp
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "dg-documenten", "gezond"]
      interval: 15s
      retries: 10
    depends_on:
      documenten-db: { condition: service_healthy }
      garage: { condition: service_started }

  # --- Zoeken: OpenSearch, voor Documenten -----------------------------------------
  # Alleen in het interne netwerk (geen poort naar buiten), daarom zonder de
  # beveiligingsplugin. De index is helemaal af te leiden uit het register en
  # de opslag van Documenten: hij zit niet in de back-up, en is hij weg, dan
  # bouwt Documenten hem vanzelf opnieuw op. Vraagt vm.max_map_count=262144 op
  # de server (bijwerken.sh zet dat).
  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSIE:-3.6.0}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms${ZOEK_GEHEUGEN:-1g} -Xmx${ZOEK_GEHEUGEN:-1g}
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    mem_limit: ${ZOEK_GRENS:-2g}
    volumes:
      - zoekdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"]
      interval: 15s
      retries: 20
      start_period: 60s

  # --- Beheer (beheer.<domein>): voor de beheerders en de kerngroep -----------------
  # Leden en rollen en organisaties (Keycloak, met het service account
  # beheer-keycloak) en de stand van de server (het statusbestand van
  # server/status.sh, alleen-lezen). Zie beheer/ONTWERP.md.
  beheer:
    build:
      context: .
      dockerfile: beheer/Dockerfile
    image: dg/beheer:latest
    restart: unless-stopped
    environment:
      BEHEER_BASIS_URL: https://beheer.${DOMEIN}
      OIDC_UITGEVER: https://aanmelden.${DOMEIN}/realms/gemeenschap
      OIDC_INTERN: http://keycloak:8080/realms/gemeenschap
      OIDC_CLIENT_ID: beheer
      OIDC_CLIENT_GEHEIM: ${BEHEER_CLIENT_SECRET:?}
      SESSIE_GEHEIM: ${BEHEER_SESSIE_GEHEIM:?}
      KEYCLOAK_CLIENT_ID: beheer-keycloak
      KEYCLOAK_GEHEIM: ${BEHEER_KEYCLOAK_SECRET:?}
      SITE_URL: https://${DOMEIN}
      PROJECTEN_URL: https://projecten.${DOMEIN}
      KENNIS_URL: https://kennis.${DOMEIN}
      DOCUMENTEN_URL: https://documenten.${DOMEIN}
    volumes:
      - beheerdata:/data
      - /var/lib/dg-gemeenschap/status:/status:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "dg-beheer", "gezond"]
      interval: 15s
      retries: 10
    depends_on: [keycloak]

volumes:
  wikidb:
  wikidata:
  wikirepo:
  caddydata:
  kcdata:
  wpdbdata:
  wphtml:
  rmdata:
  rmfiles:
  garagemeta:
  garagedata:
  docdb:
  doctmp:
  zoekdata:
  beheerdata:
